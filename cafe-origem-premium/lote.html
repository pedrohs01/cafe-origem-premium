<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3a2a1f">
  <title>Origem do lote | Café Origem Premium</title>
  <link rel="icon" type="image/png" href="/arquivos/img/favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/arquivos/css/style.css">
  <link rel="stylesheet" href="/arquivos/css/lote.css">
</head>
<body class="lot-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Café Origem Premium - vitrine">
        <img class="brand-logo" src="/arquivos/img/logo.png" alt="" width="44" height="44">
        <span><strong>Café Origem</strong><small>PREMIUM COFFEE</small></span>
      </a>
      <div class="header-actions">
        <a class="button button-outline button-sm" href="/#cafes">← Voltar à vitrine</a>
      </div>
    </div>
  </header>

  <main class="container lot-main" id="lotMain" aria-live="polite">
    <div class="lot-loading">Carregando informações do lote…</div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© <span id="year"></span> Café Origem Premium · Origem Viva</span>
      <span>Informações cadastradas pelo produtor/torrefação</span>
    </div>
  </footer>

  <script src="/arquivos/js/lote.js"></script>

</html>
